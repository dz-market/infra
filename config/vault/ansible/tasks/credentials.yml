- name: Prepare credentials directory
  ansible.builtin.file:
    path: "/credentials/{{ approle.key }}"
    state: directory
    owner: vault
    group: vault
    mode: "0700"

- name: Read saved SecretID
  ansible.builtin.set_fact:
    vault_saved_secret_id: >-
      {{ 
        lookup(
          'ansible.builtin.file', 
          '/credentials/' ~ approle.key ~ '/secret_id', 
          errors='ignore'
        ) | default('', true) | trim 
      }}

- name: Check saved SecretID
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/{{ approle.value.backend }}/role/{{ approle.key }}/secret-id/lookup"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      secret_id: "{{ vault_saved_secret_id }}"
    status_code: [200, 204, 400, 404]
  register: vault_secret_id_status
  when: vault_saved_secret_id | length > 0
  changed_when: false

- name: Check SecretID lookup result
  ansible.builtin.assert:
    that:
      - >-
        vault_secret_id_status.status | default(200) != 400
        or
        'invalid secret id' in
        (vault_secret_id_status.json.errors | default([]) | join(' ') | lower)
        or
        'failed to find entry for secret_id' in
        (vault_secret_id_status.json.errors | default([]) | join(' ') | lower)

- name: Issue missing or invalid SecretID
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/{{ approle.value.backend }}/role/{{ approle.key }}/secret-id"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body: {}
    status_code: 200
  register: vault_issued_secret_id
  when: >-
    vault_saved_secret_id | length == 0
    or vault_secret_id_status.status | default(404) != 200

- name: Save issued SecretID
  ansible.builtin.copy:
    content: "{{ vault_issued_secret_id.json.data.secret_id }}"
    dest: "/credentials/{{ approle.key }}/secret_id"
    owner: vault
    group: vault
    mode: "0400"
  when: vault_issued_secret_id is not skipped

- name: Save RoleID
  ansible.builtin.copy:
    content: "{{ approle.value.role_id }}"
    dest: "/credentials/{{ approle.key }}/role_id"
    owner: vault
    group: vault
    mode: "0400"