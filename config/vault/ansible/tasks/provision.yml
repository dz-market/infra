- name: Wait for unsealed Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/seal-status"
    method: GET
    status_code: 200
  register: vault_provision_ready
  until: not (vault_provision_ready.json.sealed | default(true))
  retries: 60
  delay: 2
  changed_when: false

- name: Login using configuration AppRole
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ lookup('ansible.builtin.file', '/credentials/' ~ vault_config_role ~ '/role_id') | trim }}"
      secret_id: "{{ lookup('ansible.builtin.file', '/credentials/' ~ vault_config_role ~ '/secret_id') | trim }}"
    status_code: 200
  register: vault_config_login
  when: vault_bootstrap_token | length == 0

- name: Select configuration token
  ansible.builtin.set_fact:
    vault_token: >-
      {{ 
        vault_bootstrap_token
        if vault_bootstrap_token | length > 0
        else vault_config_login.json.auth.client_token
      }}

- name: Initialize OpenTofu
  ansible.builtin.command:
    argv:
      - tofu
      - "-chdir={{ vault_tofu_directory }}"
      - init
      - -input=false
      - -lockfile=readonly
      - -no-color
  environment:
    TF_DATA_DIR: "{{ vault_tofu_data_directory }}"
    TF_IN_AUTOMATION: "true"
  changed_when: false

- name: Apply Vault configuration
  ansible.builtin.command:
    argv:
      - tofu
      - "-chdir={{ vault_tofu_directory }}"
      - apply
      - -input=false
      - -auto-approve
      - -no-color
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_token }}"
    TF_DATA_DIR: "{{ vault_tofu_data_directory }}"
    TF_IN_AUTOMATION: "true"
  no_log: true

- name: Read configured AppRoles
  ansible.builtin.command:
    argv:
      - tofu
      - "-chdir={{ vault_tofu_directory }}"
      - output
      - -json
      - approles
  environment:
    TF_DATA_DIR: "{{ vault_tofu_data_directory }}"
  register: vault_approles
  changed_when: false

- name: Deliver AppRole credentials
  ansible.builtin.include_tasks: credentials.yml
  loop: "{{ vault_approles.stdout | from_json | dict2items }}"
  loop_control:
    loop_var: approle
    label: "{{ approle.key }}"

- name: Verify configuration AppRole
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ lookup('ansible.builtin.file', '/credentials/' ~ vault_config_role ~ '/role_id') | trim }}"
      secret_id: "{{ lookup('ansible.builtin.file', '/credentials/' ~ vault_config_role ~ '/secret_id') | trim }}"
    status_code: 200
  register: vault_config_verification
  when: vault_bootstrap_token | length > 0