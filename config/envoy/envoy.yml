node:
    id: marketplace-edge
    cluster: marketplace-edge

admin:
    address:
        socket_address:
            address: 0.0.0.0
            port_value: 9901

dynamic_resources:
    lds_config:
        resource_api_version: V3
        path: /etc/envoy/listeners.yml

    cds_config:
        resource_api_version: V3
        path: /etc/envoy/clusters.yml