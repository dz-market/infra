resources:
    -   "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
        name: edge
        virtual_hosts:
            -   name: api
                domains: ["*"]
                routes:
                    -   match:
                            prefix: /auth.api.
                        route:
                            cluster: svc-auth
                            timeout: 15s
                    -   match:
                            prefix: /user.api.
                        route:
                            cluster: svc-user
                            timeout: 15s