#file: noinspection ComposeUnknownValues

x-auth-dsn: &auth-dsn postgres://${AUTH_POSTGRES_USER:?}:${AUTH_POSTGRES_PASSWORD:?}@${AUTH_POSTGRES_HOST:?}:5432/${AUTH_POSTGRES_DB:?}?sslmode=disable

services:
    auth-postgres:
        image: postgres:18-alpine
        profiles: [auth]
        environment:
            POSTGRES_DB: ${AUTH_POSTGRES_DB:?}
            POSTGRES_USER: ${AUTH_POSTGRES_USER:?}
            POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?}
        ports:
            - "${AUTH_POSTGRES_PORT:?}:5432"
        volumes:
            - auth-postgres-data:/var/lib/postgresql
        networks: [marketplace]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s
            start_interval: 1s
        restart: unless-stopped

    auth-migrate:
        image: ${AUTH_MIGRATE_IMAGE:-svc-auth-migrate:dev}
        pull_policy: build
        build:
            context: ../../../svc-auth
            target: migrate
        profiles: [auth]
        environment:
            GOOSE_DBSTRING: *auth-dsn
        networks: [marketplace]
        depends_on:
            auth-postgres:
                condition: service_healthy
        restart: "no"

    svc-auth:
        image: ${AUTH_IMAGE:-svc-auth:dev}
        pull_policy: build
        build:
            context: ../../../svc-auth
            target: runtime
        profiles: [auth]
        environment:
            VAULT_ADDR: ${VAULT_ADDR:?}
            VAULT_ROLE_ID_FILE: /run/secrets/vault/role_id
            VAULT_SECRET_ID_FILE: /run/secrets/vault/secret_id
            GRPC_ADDR: ":${AUTH_GRPC_PORT:?}"
            GRPC_REFLECTION: ${AUTH_GRPC_REFLECTION:-false}
            POSTGRES_DSN: *auth-dsn
            KAFKA_BROKERS: ${AUTH_KAFKA_BROKERS:?}
        ports:
            - "${AUTH_GRPC_PORT:?}:${AUTH_GRPC_PORT:?}"
        volumes:
            -   type: bind
                source: ../../.cache/vault/approle/svc-auth
                target: /run/secrets/vault
                read_only: true
                bind:
                    create_host_path: true
        networks: [marketplace]
        depends_on:
            auth-postgres:
                condition: service_healthy
            auth-migrate:
                condition: service_completed_successfully
            vault-config:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "grpc-health-probe", "-addr=127.0.0.1:${AUTH_GRPC_PORT}"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s
            start_interval: 1s
        restart: unless-stopped

volumes:
    auth-postgres-data: