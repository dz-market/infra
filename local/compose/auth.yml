#file: noinspection ComposeUnknownValues

x-auth-dsn: &auth-dsn postgres://${AUTH_POSTGRES_USER:?}:${AUTH_POSTGRES_PASSWORD:?}@${AUTH_POSTGRES_HOST:?}:5432/${AUTH_POSTGRES_DB:?}?sslmode=disable

services:
    auth-migrate:
        image: ${AUTH_MIGRATE_IMAGE:?}
        profiles: [auth]
        environment:
            GOOSE_DBSTRING: *auth-dsn
        networks: [marketplace]
        depends_on:
            postgres-config:
                condition: service_completed_successfully
        restart: "no"

    svc-auth:
        image: ${AUTH_IMAGE:?}
        profiles: [auth]
        environment:
            VAULT_ADDR: ${VAULT_ADDR:?}
            GRPC_ADDR: ":${AUTH_GRPC_PORT:?}"
            GRPC_REFLECTION: ${AUTH_GRPC_REFLECTION:-false}
            POSTGRES_DSN: *auth-dsn
            KAFKA_BROKERS: ${AUTH_KAFKA_BROKERS:?}
        ports:
            - "${AUTH_GRPC_PORT:?}:${AUTH_GRPC_PORT:?}"
        networks: [marketplace]
        depends_on:
            postgres:
                condition: service_healthy
            auth-migrate:
                condition: service_completed_successfully
            vault-proxy-auth:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "grpc-health-probe", "-addr=127.0.0.1:${AUTH_GRPC_PORT}"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s
            start_interval: 1s
        restart: unless-stopped