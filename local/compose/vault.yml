#file: noinspection ComposeUnknownValues

x-vault-server: &vault-server
    image: hashicorp/vault:${VAULT_VERSION:?}
    profiles: [auth]
    environment:
        VAULT_ADDR: http://127.0.0.1:8200
    tmpfs:
        - /tmp
    healthcheck:
        test: ["CMD", "vault", "status"]
        interval: 5s
        timeout: 3s
        retries: 12
        start_period: 10s
        start_interval: 1s
    restart: unless-stopped

x-vault-automation: &vault-automation
    image: marketplace-vault-automation:local
    build:
        context: ../../config/vault
        dockerfile: Dockerfile
        args:
            VAULT_VERSION: ${VAULT_VERSION:?}
            OPENTOFU_VERSION: ${OPENTOFU_VERSION:?}
    profiles: [auth]
    environment:
        VAULT_ADDR: http://vault:8200
        VAULT_UNSEAL_ADDR: http://vault-unseal:8200
    tmpfs:
        - /tmp
    networks: [vault]

services:
    vault-unseal:
        <<: *vault-server
        command: ["vault", "server", "-config=/etc/vault/unseal.hcl"]
        volumes:
            -   type: bind
                source: ../../config/vault/server/unseal.hcl
                target: /etc/vault/unseal.hcl
                read_only: true
                bind:
                    create_host_path: false

            - vault-unseal-data:/vault/file
        networks: [vault]

    vault-transit-bootstrap:
        <<: *vault-automation
        command: ["playbooks/bootstrap-transit.yml"]
        volumes:
            - vault-transit-bootstrap-keys:/bootstrap
            - vault-state:/state
            - vault-transit-config-credentials:/credentials/transit-config
            - vault-transit-token:/run/secrets/transit
        depends_on:
            vault-unseal:
                condition: service_started
        restart: "no"

    vault:
        <<: *vault-server
        command: ["vault", "server", "-config=/etc/vault/main.hcl"]
        environment:
            VAULT_ADDR: http://127.0.0.1:8200
            SKIP_SETCAP: "true"
        ports:
            - "127.0.0.1:${VAULT_PORT:?}:8200"
        volumes:
            -   type: bind
                source: ../../config/vault/server/main.hcl
                target: /etc/vault/main.hcl
                read_only: true
                bind:
                    create_host_path: false

            - vault-data:/vault/file

            -   type: volume
                source: vault-transit-token
                target: /run/secrets/transit
                read_only: true
        networks: [vault]
        depends_on:
            vault-transit-bootstrap:
                condition: service_completed_successfully

    vault-main-bootstrap:
        <<: *vault-automation
        command: ["playbooks/bootstrap-main.yml"]
        volumes:
            - vault-main-bootstrap-keys:/bootstrap
            - vault-state:/state
            - vault-config-credentials:/credentials/infra-config
            - auth-vault-credentials:/credentials/svc-auth
        depends_on:
            vault:
                condition: service_started
        restart: "no"

    vault-proxy-auth:
        image: hashicorp/vault:${VAULT_VERSION:?}
        profiles: [auth]
        command: ["vault", "proxy", "-config=/etc/vault/proxy.hcl"]
        environment:
            VAULT_ADDR: http://vault:8200
        ports:
            - "127.0.0.1:${VAULT_AUTH_PROXY_PORT:?}:8200"
        volumes:
            -   type: bind
                source: ../../config/vault/proxy/proxy.hcl
                target: /etc/vault/proxy.hcl
                read_only: true
                bind:
                    create_host_path: false

            -   type: volume
                source: auth-vault-credentials
                target: /run/secrets/vault
                read_only: true
        tmpfs:
            - /tmp
        networks: [vault, marketplace]
        depends_on:
            vault:
                condition: service_healthy
            vault-main-bootstrap:
                condition: service_completed_successfully
                restart: true
        healthcheck:
            test:
                - CMD-SHELL
                - vault read -address=http://127.0.0.1:8200 auth/token/lookup-self >/dev/null
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 5s
            start_interval: 1s
        restart: unless-stopped

volumes:
    vault-unseal-data:
    vault-data:

    vault-transit-bootstrap-keys:
    vault-main-bootstrap-keys:

    vault-state:

    vault-transit-token:

    vault-transit-config-credentials:
    vault-config-credentials:

    auth-vault-credentials:

networks:
    vault: