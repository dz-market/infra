#file: noinspection ComposeUnknownValues

services:
    kafka:
        image: redpandadata/redpanda:v26.2.3
        profiles: [auth, user]
        command:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr=internal://kafka:9092,external://127.0.0.1:${KAFKA_PORT:?}
            - --rpc-addr=kafka:33145
            - --advertise-rpc-addr=kafka:33145
        ports:
            - "${KAFKA_PORT:?}:19092"
        volumes:
            - redpanda-data:/var/lib/redpanda/data
        networks: [marketplace]
        healthcheck:
            test: ["CMD-SHELL", "rpk cluster health"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
            start_interval: 1s
        restart: unless-stopped

    kafka-config:
        image: ghcr.io/opentofu/opentofu:${OPENTOFU_VERSION}
        profiles: [auth, user]
        working_dir: /config
        entrypoint: ["/bin/sh", "-ec"]
        command:
            - |
                tofu init -input=false -lockfile=readonly
                tofu apply -input=false -auto-approve
        environment:
            TF_IN_AUTOMATION: "true"
            TF_DATA_DIR: /state/.terraform
        volumes:
            -   type: bind
                source: ../../config/kafka
                target: /config
                read_only: true
                bind:
                    create_host_path: false

            - redpanda-config-state:/state
        networks: [marketplace]
        depends_on:
            kafka:
                condition: service_healthy
        restart: "no"

    kafka-console:
        image: redpandadata/console:v3.12.0
        profiles: [auth, user]
        environment:
            KAFKA_BROKERS: kafka:9092
        ports:
            - "${KAFKA_CONSOLE_PORT:?}:8080"
        networks: [marketplace]
        depends_on:
            kafka:
                condition: service_healthy
        restart: unless-stopped

volumes:
    redpanda-data:
    redpanda-config-state: