#file: noinspection ComposeUnknownValues

services:
    envoy:
        image: marketplace/envoy:local
        pull_policy: build
        build:
            context: ../..
            dockerfile: config/envoy/Dockerfile
            args:
                ENVOY_IMAGE: envoyproxy/envoy:${ENVOY_VERSION:?}
                PROTOBUF_IMAGE: ${PROTOBUF_IMAGE:?}
        profiles: [auth, user]
        ports:
            - "127.0.0.1:${GATEWAY_HTTP_PORT:?}:8080"
            - "127.0.0.1:${GATEWAY_ADMIN_PORT:?}:9901"
        networks: [marketplace]
        healthcheck:
            test:
                - CMD
                - bash
                - -c
                - "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
            start_interval: 1s
        depends_on:
            svc-auth:
                condition: service_healthy
                required: false
            svc-user:
                condition: service_healthy
                required: false
        restart: unless-stopped