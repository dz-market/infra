version: "3"

vars:
    COMPOSE: 'docker compose -f {{printf "%s/local/compose.yml" .ROOT_DIR | shellQuote}}'
    PROFILES: '{{range splitList " " (.CLI_ARGS | default "*")}}--profile "{{.}}" {{end}}'
    APPS: [auth, user]

tasks:
    up:
        desc: "Start containers: task up -- [auth user] [--deps] [--exclude auth] (no args = all profiles)"
        cmd: >-
            {{- $selected := list -}}
            {{- $excluded := list -}}
            {{- $deps := false -}}
            {{- $expectExclude := false -}}
            
            {{- range .CLI_ARGS_LIST -}}
                {{- if $expectExclude -}}
                    {{- if not (has . $.APPS) -}}
                        {{- fail (printf "Unknown excluded service: %s" .) -}}
                    {{- end -}}
                    {{- $excluded = append $excluded . -}}
                    {{- $expectExclude = false -}}
                {{- else if eq . "--deps" -}}
                    {{- $deps = true -}}
                {{- else if eq . "--exclude" -}}
                    {{- $expectExclude = true -}}
                {{- else if has . $.APPS -}}
                    {{- $selected = append $selected . -}}
                {{- else -}}
                    {{- fail (printf "Unknown service or option: %s" .) -}}
                {{- end -}}
            {{- end -}}
            
            {{- if $expectExclude -}}
                {{- fail "Expected a service name after --exclude" -}}
            {{- end -}}
            
            {{- if not $selected -}}
                {{- $selected = .APPS -}}
            {{- end -}}
            {{- $selected = uniq $selected -}}
            
            {{.COMPOSE}}{{range $selected}} --profile {{. | shellQuote}}{{end}} up -d --wait --wait-timeout 60{{range $selected}} --scale {{printf "svc-%s" . | shellQuote}}={{if or $deps (has . $excluded)}}0{{else}}1{{end}}{{end}}

    stop:
        desc: "Stop containers without removing them: task stop -- auth (no args = all profiles)"
        cmd: "{{.COMPOSE}} {{.PROFILES}} stop"

    restart:
        desc: "Restart containers with their current config: task restart -- auth (no args = all profiles)"
        cmd: "{{.COMPOSE}} {{.PROFILES}} restart"

    down:
        desc: "Stop and remove containers, keeping their data: task down -- auth (no args = all profiles)"
        cmd: "{{.COMPOSE}} {{.PROFILES}} down"

    nuke:
        desc: "Remove all containers and delete all data"
        prompt: "This will delete data volumes of ALL services. Continue?"
        cmd: '{{.COMPOSE}} --profile "*" down -v'

    ps:
        desc: "Show status of all containers"
        cmd: '{{.COMPOSE}} --profile "*" ps'

    logs:
        desc: "Follow logs: task logs -- postgres (no args = all services)"
        cmd: '{{.COMPOSE}} --profile "*" logs -f {{.CLI_ARGS}}'

    gateway:build:
        desc: "Build Envoy with the selected descriptor image"
        cmd: '{{.COMPOSE}} --profile "*" build envoy'

    gateway:update:
        desc: "Pull gateway base images, rebuild and update Envoy"
        cmds:
            - '{{.COMPOSE}} --profile "*" build --pull envoy'
            - >-
                {{.COMPOSE}} --profile "*"
                up -d --no-deps --no-build
                --wait --wait-timeout 60 envoy